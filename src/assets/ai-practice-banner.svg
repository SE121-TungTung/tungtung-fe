<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b2948" />
      <stop offset="52%" stop-color="#154c82" />
      <stop offset="100%" stop-color="#0f7c9c" />
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(650 70) rotate(135) scale(280 220)">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160 260) rotate(-35) scale(260 180)">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="260" y1="56" x2="540" y2="264" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <rect width="800" height="320" fill="url(#bg)" />
  <rect width="800" height="320" fill="url(#glow1)" />
  <rect width="800" height="320" fill="url(#glow2)" />

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="160" y1="0" x2="160" y2="320" />
    <line x1="320" y1="0" x2="320" y2="320" />
    <line x1="480" y1="0" x2="480" y2="320" />
    <line x1="640" y1="0" x2="640" y2="320" />
  </g>

  <!-- Left decorative wave bars -->
  <g fill="#38bdf8" fill-opacity="0.28">
    <rect x="96" y="136" width="8" height="48" rx="4" />
    <rect x="116" y="112" width="8" height="96" rx="4" />
    <rect x="136" y="128" width="8" height="64" rx="4" />
    <rect x="156" y="96" width="8" height="128" rx="4" />
    <rect x="176" y="120" width="8" height="80" rx="4" />
    <rect x="196" y="140" width="8" height="40" rx="4" />
  </g>

  <!-- Center glass badge -->
  <rect x="250" y="54" width="300" height="212" rx="22" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" />

  <!-- Progress / skill rings inside center card -->
  <circle cx="330" cy="134" r="38" stroke="#ffffff" stroke-opacity="0.14" stroke-width="8" />
  <path d="M330 96 A38 38 0 1 1 296 151" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <circle cx="330" cy="134" r="14" fill="#38bdf8" fill-opacity="0.25" />

  <!-- Skill bars on right side of center card -->
  <rect x="392" y="102" width="118" height="10" rx="5" fill="#ffffff" fill-opacity="0.78" />
  <rect x="392" y="124" width="88" height="8" rx="4" fill="#38bdf8" fill-opacity="0.85" />
  <rect x="392" y="144" width="104" height="8" rx="4" fill="#ffffff" fill-opacity="0.38" />
  <rect x="392" y="164" width="72" height="8" rx="4" fill="#ffffff" fill-opacity="0.24" />

  <!-- Bottom trend line inside center card -->
  <path d="M286 226 L338 206 L386 214 L442 188 L508 172" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="338" cy="206" r="4.5" fill="#ffffff" />
  <circle cx="386" cy="214" r="4.5" fill="#ffffff" />
  <circle cx="442" cy="188" r="4.5" fill="#ffffff" />
  <circle cx="508" cy="172" r="5.5" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />

  <!-- Right decorative wave bars -->
  <g fill="#38bdf8" fill-opacity="0.28">
    <rect x="596" y="140" width="8" height="40" rx="4" />
    <rect x="616" y="120" width="8" height="80" rx="4" />
    <rect x="636" y="96" width="8" height="128" rx="4" />
    <rect x="656" y="128" width="8" height="64" rx="4" />
    <rect x="676" y="112" width="8" height="96" rx="4" />
    <rect x="696" y="136" width="8" height="48" rx="4" />
  </g>
</svg>

