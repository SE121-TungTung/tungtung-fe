name: CI

on:
  pull_request:
    branches: [main, dev, develop]
  push:
    branches: [main, dev]

jobs:
  quality-check:
    name: Quality & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm & Node.js 24 (LTS)
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Unit Tests
        run: pnpm test

      - name: Build Verification
        run: pnpm build
